name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests & Quality Checks
        run: |
          npm run lint
          npm run format:check
          npm test

      - name: Build Project
        run: npm run build

      # Creates a commit to main with the updated version number
      - name: Automated Version & Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # Ensure the code is up to date with main
      - name: Sync Workspace to Fresh Main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      # Create the Sync PR from main into dev
      - name: Create Sync PR to Dev
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          branch: chore/sync-main-to-dev
          title: "chore: sync release version from main"
          body: |
           This is an automated PR to sync the latest release version, changelog, and tags from `main` back into the `dev` branch.
           
           Please review and merge to keep development environments aligned.
          commit-message: "chore: sync release version from main [skip ci]"
          delete-branch: true
