name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests & Quality Checks
        run: |
          npm run lint
          npm run format:check
          npm test

      - name: Build Project
        run: npm run build

      # Creates a commit to main with the updated version number
      - name: Automated Version & Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          npx semantic-release
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      # Create the Sync PR from main into dev
      - name: Create Sync PR to Dev
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: dev
          branch: chore/sync-release-v${{ env.NEW_VERSION }}-to-dev
          title: "chore: sync release v${{ env.NEW_VERSION }} to dev"
          body: |
           This is an automated PR to sync the latest release version, changelog, and tags from `main` back into the `dev` branch.
           
           Please review and merge to keep development environments aligned.
          commit-message: "chore: sync release v${{ env.NEW_VERSION }} to dev [skip ci]"
          delete-branch: true

      # Create the PR to update main with version bump and changelog
      - name: Create PR to Update Main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: chore/update-release-v${{ env.NEW_VERSION }}-on-main
          title: "chore(release): v${{ env.NEW_VERSION }}"
          body: |
           This is an automated PR to update the version number and CHANGELOG.md on the `main` branch after a successful release.
           
           This is necessary because direct pushes to `main` are restricted.
          commit-message: "chore(release): v${{ env.NEW_VERSION }} [skip ci]"
          delete-branch: true
