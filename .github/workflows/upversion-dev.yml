name: Upversion Dev

on:
  push:
    branches:
      - dev

jobs:
  upversion:
    runs-on: ubuntu-latest
    # Skip if the commit was made by semantic-release itself
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests & Quality Checks
        run: |
          npm run lint
          npm run format:check
          npm test

      - name: Automated Upversion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a temporary config to override package.json release settings
          # This ensures we bump version, update changelog, commit to git, and create a GitHub release
          # but DISBALE npm publishing on the dev branch.
          cat > .releaserc.json <<EOF
          {
            "branches": ["dev"],
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              "@semantic-release/changelog",
              ["@semantic-release/npm", { "npmPublish": false }],
              ["@semantic-release/git", {
                "assets": ["package.json", "CHANGELOG.md"],
                "message": "chore(release): v\${nextRelease.version} [skip ci]"
              }],
              "@semantic-release/github"
            ]
          }
          EOF
          npx semantic-release --config .releaserc.json
